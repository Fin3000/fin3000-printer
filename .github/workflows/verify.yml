name: Verify printer source
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Install pinned development dependencies
        run: npm ci --ignore-scripts
      - name: Install native process-test prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gjs
      - name: Typecheck and isolated tooling checks
        run: |
          npm run check:core
          npm run test:core
          npm test
      - name: License, packaging and release checks
        run: |
          python3 -B -I -m unittest discover -s tests -p test_project_license.py
          python3 -B -I -m unittest discover -s tests -p test_linux_package.py
          python3 -B -I -m unittest discover -s tests -p test_linux_product_package.py
          python3 -B -I -m unittest discover -s tests -p test_linux_release.py
      - name: Whitespace check
        run: git diff --check
